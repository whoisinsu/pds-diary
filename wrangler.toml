name = "pds-diary"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 화면(public/)은 Workers Assets로 내보내고, /api/* 요청만 Worker 코드가 받는다.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 연결. database_id는 DB를 가리키는 이름표일 뿐 비밀키가 아니다(이것만으로는 접근할 수 없음).
[[d1_databases]]
binding = "DB"
database_name = "pds-diary"
database_id = "fba648b8-0d7e-4494-ac5a-068702f2db38"
migrations_dir = "migrations"

[observability]
enabled = true
